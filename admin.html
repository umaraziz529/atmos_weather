<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atmos — Admin</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><a class="brand" href="./">✦ atmos</a><a class="admin-link" href="./">← Weather</a></header><main class="shell"><section class="hero"><p class="eyebrow">PRIVATE AREA</p><h1>Location <span>records.</span></h1><p class="subtitle">Only your configured admin account can view or delete records.</p></section><section id="login-panel" class="current-card" style="display:block;max-width:520px"><h2>Administrator sign in</h2><form id="login-form" style="display:grid;gap:12px;margin-top:20px"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary-button">Sign in</button><p id="login-status" class="status"></p></form></section><section id="records-panel" class="hidden"><div style="display:flex;gap:10px;flex-wrap:wrap;margin:24px 0"><p id="records-status" class="status">Loading…</p><button id="refresh-btn" class="secondary-button">Refresh</button><button id="export-btn" class="secondary-button">Export CSV</button><button id="signout-btn" class="secondary-button">Sign out</button></div><div id="records-list"></div></section></main><script type="module" src="admin.js"></script></body></html>
